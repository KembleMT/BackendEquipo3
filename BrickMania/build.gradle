plugins {
	id 'java'
	id 'org.springframework.boot' version '2.7.15'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.generation'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Dependencia para crear API REST
	implementation 'org.springframework.boot:spring-boot-starter-web'
	
	// Dependencia para Spring Data JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Dependencia para MySQL (ahora en implementation)
	implementation 'mysql:mysql-connector-java:8.0.33'

	// Dependencia para validaciones con anotaciones
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Dependencia opcional para autenticación
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-crypto'
    

	// JWT para autenticación con tokens
    implementation 'io.jsonwebtoken:jjwt:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	

	// Dependencias para pruebas
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
}

tasks.named('test') {
	useJUnitPlatform()
}
