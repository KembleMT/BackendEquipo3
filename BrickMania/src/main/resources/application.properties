# Nombre de la aplicaci n
spring.application.name=BrickMania
# Configuraci n de la base de datos MySQL
spring.datasource.url=jdbc:mysql://${PROD_DB_HOST}:3306/${PROD_DB_NAME}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}
# Dialecto de MySQL 8 para Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Actualiza autom ticamente las tablas si hay cambios en los modelos
spring.jpa.hibernate.ddl-auto=${PROD_DDL}
# Muestra las consultas SQL en la consola (Opcional, pero  til para depuraci n)
spring.jpa.show-sql=true
